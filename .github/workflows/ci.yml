name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allows manual triggering from the Actions tab

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # let all combos run even if one fails, so you see the full matrix
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (locked dependencies)
        run: uv sync --frozen

      - name: Config / plumbing check (dry run)
        run: uv run python -m vit_histo.train dry_run=true

      - name: Run tests
        run: uv run pytest tests/ -v
