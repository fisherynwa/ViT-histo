[project]
name = "vit-histo"
version = "0.1.0"
description = "Fine-tuning a Vision Transformer for histopathology image classification (PatchCamelyon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "datasets>=2.19",
    "hydra-core>=1.3",
    "loguru>=0.7",
    "mlflow>=2.12",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pillow>=10.0",
    "hydra-optuna-sweeper>=1.2.0",
    "optuna>=2.10.0,<3.0.0",
    "wandb>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vit_histo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
