defaults:
  - model: vit_base
  - data: pcam
  - train: default
  - study: default
  - override hydra/sweeper: optuna
  - _self_

# Global settings
seed: 42
device: auto
dry_run: false
output_dir: outputs

# MLflow
mlflow:
  enabled: true
  experiment_name: vit-histopathology
  tracking_uri: null

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  sweeper:
    sampler:
      _target_: optuna.samplers.RandomSampler
      seed: 42
    study_name: vit_histo_lr
    direction: maximize
    n_trials: 20
    n_jobs: 1